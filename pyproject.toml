[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bluefish"
version = "0.1.0"
description = "Bluefish — a host-security AI modeled on the human immune system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ReadIT" }]
keywords = ["security", "immune-system", "anomaly-detection", "hids", "ai"]
dependencies = [
    "psutil>=5.9",
    "typer>=0.12",
    "rich>=13.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "anthropic>=0.40"]

[project.scripts]
bluefish = "bluefish.cli:app"

[tool.setuptools.packages.find]
include = ["bluefish*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
